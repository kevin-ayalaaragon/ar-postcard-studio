# Resume/portfolio skill tracker for this repo.
#
# No canonical, authoritative format exists for "track resume
# differentiators in a repo file" (checked during architecture research -
# see docs/adr/0000-record-architecture-decisions.md's sourcing rule). This
# file is loosely modeled on the *ring* concept from ThoughtWorks'
# Technology Radar (https://www.thoughtworks.com/radar) - structural
# inspiration only, not a literal citation for this exact schema.
#
# Update this alongside architecture changes, not after the fact from memory.

project: ar-postcard-studio
last_updated: "2026-09-30"

differentiators:
  - skill: Full-stack TypeScript (Next.js App Router monolith)
    evidence:
      - src/app/api/postcards/route.ts
      - src/app/postcard/[slug]/page.tsx
    resume_bullet: >-
      Built a full-stack Next.js (App Router) application - typed API route
      handlers, server components, and a client-side upload flow - end to
      end from a public submission form to an admin fulfillment dashboard.

  - skill: Relational data modeling with an ORM (Prisma)
    evidence:
      - prisma/schema.prisma
      - src/lib/db.ts
    resume_bullet: >-
      Modeled and migrated a relational schema (Postgres via Neon, same
      provider dev and prod) with Prisma, including a deliberate version
      pin to avoid an unreleased major with a breaking config format.

  - skill: WebAR integration generalized to a multi-tenant data model
    evidence:
      - src/app/postcard/[slug]/ArViewer.tsx
    resume_bullet: >-
      Took a single-use MindAR.js/A-Frame WebAR viewer (image tracking +
      video overlay) and generalized it into a per-record dynamic viewer
      driven by database state, while working around React/custom-element
      DOM-ownership conflicts.

  - skill: Server-side image processing and print-file generation
    evidence:
      - src/lib/postcard-print.ts
      - src/lib/qr.ts
    resume_bullet: >-
      Generated print-ready output (SVG-to-raster text layout via sharp,
      composited with a standards-compliant QR code) entirely server-side.

  - skill: Storage abstraction / provider-agnostic design
    evidence:
      - src/lib/storage.ts
    resume_bullet: >-
      Designed a storage interface that runs on the local filesystem in dev
      and swaps to S3-compatible object storage in prod with no caller
      changes, following the Twelve-Factor "backing services" pattern.

  - skill: Architecture decision documentation (ADR/MADR discipline)
    evidence:
      - docs/adr/
    resume_bullet: >-
      Maintained a cited architecture decision ledger (MADR format) across
      an AI-assisted build, requiring a traceable source for every
      technology choice, including synthesized ones.

  - skill: Security-conscious defaults under time pressure
    evidence:
      - src/lib/admin-auth.ts
      - src/lib/qr.ts
    resume_bullet: >-
      Applied timing-safe secret comparison for an internal admin
      endpoint and print-safe QR error-correction/quiet-zone settings
      sourced from the format's own standard, while explicitly documenting
      the admin auth as an MVP placeholder rather than a finished security
      posture.

  - skill: Caught a deploy-blocking architecture gap before it shipped
    evidence:
      - docs/adr/0009-single-postgres-datasource.md
      - prisma/schema.prisma
    resume_bullet: >-
      Identified that a documented ORM architecture decision (SQLite dev /
      Postgres prod, switched via an environment variable) was technically
      unworkable - the datasource provider is a fixed value, not
      environment-resolved, and SQLite-dialect migrations don't run
      against Postgres - before it caused a failed production deploy;
      revised the decision (single Postgres datasource, dev/prod parity)
      and documented the reversal with cited sources rather than silently
      patching around it.

  - skill: Cloud deployment architecture (Vercel + managed Postgres + S3-compatible storage)
    evidence:
      - docs/adr/0010-hosting-vercel-neon-b2.md
      - src/lib/storage.ts
    resume_bullet: >-
      Selected and implemented a $0/month production hosting stack
      (Vercel, Neon Postgres, Backblaze B2) evaluated against four
      alternatives on cost, payment-method exposure, job-market
      legibility, and this app's actual runtime constraints (a
      native-binary image-processing dependency needing a Node.js, not
      Edge, function runtime) - including reversing an initial choice
      (Cloudflare R2) after finding it required a card on file that a
      technically-equivalent alternative didn't - then implemented the
      S3-compatible storage driver behind the project's existing
      provider-agnostic storage interface with no caller changes.

  - skill: Exposed application functionality as an MCP server (agent-callable tools)
    evidence:
      - src/app/mcp/route.ts
      - docs/adr/0011-admin-mcp-server.md
    resume_bullet: >-
      Exposed an existing admin workflow as a Model Context Protocol (MCP)
      server - typed tool schemas (Zod) with structured input/output and
      read/write annotations - so any MCP-speaking AI client can drive
      postcard fulfillment, without duplicating the underlying API routes'
      logic.

  - skill: Found and fixed a broken-access-control vulnerability before first deploy
    evidence:
      - docs/adr/0011-admin-mcp-server.md
      - src/app/mcp/route.ts
      - src/lib/admin-auth.ts
    resume_bullet: >-
      Identified that a newly added MCP endpoint had no authentication of
      its own callers - it forwarded the server's real admin secret to
      internal APIs on any caller's behalf, so once that secret was
      configured in production, an unauthenticated request to a public URL
      would gain both PII read access and write access to mutate customer
      data (a confused-deputy / broken-access-control pattern, OWASP API
      Security Top 10 category). Caught by reviewing the route rather than
      trusting its own architecture decision record's auth claim, fixed by
      gating the handler with the app's existing auth check, and corrected
      the ADR's inaccurate claim in place rather than leaving it misleading
      for the next reader.

  - skill: Debugged a silent production failure from a falsy-value edge case
    evidence:
      - src/lib/base-url.ts
      - tests/base-url.test.ts
    resume_bullet: >-
      Root-caused every MCP tool call failing in production to a
      nullish-coalescing operator (??) treating a configured-but-empty
      environment variable as present, when the code's intent required
      treating any falsy value as absent; fixed with the correct operator
      and replaced the remaining static per-environment URL with the
      platform's own auto-injected per-deployment value, removing a class
      of misconfiguration entirely rather than just correcting one instance
      of it.

  - skill: Automated regression tests for security and configuration bugs (Vitest)
    evidence:
      - docs/adr/0012-vitest-testing.md
      - tests/mcp-route.test.ts
      - tests/api-routes.test.ts
      - tests/admin-auth.test.ts
      - tests/base-url.test.ts
      - .github/workflows/ci.yml
    resume_bullet: >-
      Added a 71-test Vitest suite (7 files, about 2 seconds) that runs in
      CI after lint and build, including regression tests for the two
      production bugs already fixed by hand: the unauthenticated /mcp route
      (401 without a secret, 401 with a wrong one, 200 with the correct one,
      repeated across the admin routes) and the empty-string
      PUBLIC_BASE_URL fallback. Each regression test was confirmed to fail
      when its original bug was deliberately reintroduced. Also covers the
      public submission pipeline, the storage driver's path-traversal guard
      and fail-closed B2 configuration, and QR and print-back generation
      decoded back to the exact URL. Prisma is mocked and the AR viewer is
      not covered; both limits are recorded in the ADR.
